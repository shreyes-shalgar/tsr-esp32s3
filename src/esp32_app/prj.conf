# ---------------------------------------------------------------------------
# UART: polled receive, deliberately NOT interrupt driven.
#
# The first version of this application used CONFIG_UART_INTERRUPT_DRIVEN with
# an ISR feeding a ring buffer, and it silently lost bytes on a fast host
# burst. That is what an ISR does here: it drains the hardware FIFO as fast as
# the line delivers, and the overrun simply moves from the FIFO into the ring
# buffer - where it is discarded without any signal to the sender.
#
# rx_getc() in main.c polls with uart_poll_in() instead, so bytes stay in the
# hardware FIFO until the application takes them.
#
# What that buys depends on the transport, and the distinction matters:
#   - On QEMU the UART is a socket chardev, so a full guest FIFO stops QEMU
#     reading the TCP socket and the host's send() blocks. Verified: a
#     56,180-byte burst - four images back to back, no handshake at all, one
#     write - produced four "RECEIVED 6912 bytes" and four predictions,
#     nothing dropped. That is TCP flow control doing the work.
#   - On real hardware it buys nothing on the wire. Hardware flow control is
#     NOT enabled here (no hw-flow-control in the devicetree, no RTS/CTS
#     Kconfig), so a full FIFO asserts nothing and further bytes are lost.
#     The handshake is the protection: READY is sent only when the receive
#     loop is ready, and send_image.py waits for it. See the comment above
#     rx_getc() in main.c for the numbers.
# ---------------------------------------------------------------------------
CONFIG_SERIAL=y
# CONFIG_UART_INTERRUPT_DRIVEN is not set

# Console kept for the boot banner; the protocol uses the UART driver directly.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# No printf/float formatting is used - keeps the image small.
CONFIG_CBPRINTF_NANO=y

# The inference arena and payload buffer are static; give main a modest stack.
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_BOOT_BANNER=y

# Not newlib. With this unset Zephyr 4.4 selects picolibc (confirmed in the
# generated .config: CONFIG_PICOLIBC=y), which is smaller and already provides
# the one libm call in the image - expf(), used once per prediction to turn the
# int8 logits into the reported confidence percentage. The inference path
# itself is integer-only; nothing in it touches floating point.
CONFIG_NEWLIB_LIBC=n

# ---------------------------------------------------------------------------
# ESP32-S3-DevKitC-1 N16R8: ESP32-S3-WROOM-1 with 16 MB flash and 8 MB octal
# PSRAM. The Zephyr board defaults to an 8 MB flash header, which is wrong for
# this module - esptool writes the size into the image header and the SPI flash
# size register is configured from it.
#
# PSRAM is deliberately left disabled. The whole inference arena is 9,984 bytes
# of internal SRAM; nothing in this application needs external RAM, and not
# enabling it keeps the boot path and the pin configuration simpler.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
